name: AI eval (extreme)

# The extreme live eval (~670 cases of src/data/eval/aiExtremeCases.ts, run by
# scripts/ai-eval-big.ts). Calls the Anthropic API and costs roughly $0.5-1 per full run, so it runs by hand, and on a working branch only when the eval
# itself changes (a workflow must be on main before it can be started by hand). Without the
# ANTHROPIC_API_KEY secret it skips. The optional `limit` input runs only the first N cases.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Run only the first N cases (empty = all)'
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths:
      - 'src/data/eval/aiExtremeCases.ts'
      - 'scripts/ai-eval-big.ts'
      - 'src/data/eval/aiScore.ts'
      - '.github/workflows/ai-eval-extreme.yml'

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_EVAL_LIMIT: ${{ inputs.limit }}
      AI_EVAL_SUITE: extreme
    steps:
      - name: Skip without the API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY secret is not set; extreme AI eval skipped." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 22
          cache: npm
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm ci
      # The Worker's pinned Anthropic SDK and zod; scripts/ai-eval-big.ts imports them from here.
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm ci --prefix server/yerim-ai
      - name: Run extreme AI eval
        if: env.ANTHROPIC_API_KEY != ''
        run: npx --yes tsx@4.23.15 scripts/ai-eval-big.ts
      - name: Publish summary
        if: always() && env.ANTHROPIC_API_KEY != ''
        run: '[ -f docs/ai-eval-extreme.md ] && cat docs/ai-eval-extreme.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: ai-eval-extreme
          path: docs/ai-eval-extreme.md
          if-no-files-found: ignore
