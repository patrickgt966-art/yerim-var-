name: Data refresh

# Collects static parking, place, rail and food data for İzmir and İstanbul
# (OpenStreetMap + İzmir open data portal + Overture Maps).
# The app bundles the result; it never calls these services itself.

on:
  schedule:
    - cron: '17 4 1 * *' # monthly, 1st day 04:17 UTC
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/fetch-sources.mjs', 'scripts/fetch-overture.py', 'scripts/fetch-ispark-sample.mjs', 'data/overture-blocklist.json', '.github/workflows/data-refresh.yml']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Five cities (İzmir, İstanbul, Ankara, Bursa, Antalya). Overpass is capped in the script at
    # 20 min for İzmir + 45 min for İstanbul + 37 min for Ankara + 30 min for Bursa + 30 min for
    # Antalya (tiled places/food); CKAN calls (İzmir, and Bursa's optional Açık Yeşil) have 60 s
    # timeouts and 120 s downloads; Overture reads all cities' places (five scans) plus a shared
    # 35 min website check (split between the cities by candidate count).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-sources.mjs
      # Live İSPARK response sample for review (data/raw/); must never fail the run.
      - name: İSPARK sample
        continue-on-error: true
        run: node scripts/fetch-ispark-sample.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow shapely
      - run: python scripts/fetch-overture.py
        env:
          YERIM_WEB_CHECK: '1'
      - run: cat data/sources-report.md >> "$GITHUB_STEP_SUMMARY"

      # Script changes on a working branch: commit the data to that branch.
      - name: Commit to branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m 'chore(data): refresh static parking data'
          # The branch may have moved while the (slow) fetch ran.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # Scheduled or manual runs: propose the update as a pull request.
      - name: Open pull request
        if: github.event_name != 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/refresh
          title: 'chore(data): refresh static parking data'
          commit-message: 'chore(data): refresh static parking data'
          body: 'Automated run of `scripts/fetch-sources.mjs`. See `data/sources-report.md`.'
          add-paths: data/
