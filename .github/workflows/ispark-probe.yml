# Temporary: checks whether the İSPARK live endpoint answers non-browser clients. Remove after.
name: ispark probe
on:
  push:
    branches: [claude/project-finalization-release-f0b8cc]
    paths: ['.github/workflows/ispark-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe with several clients
        run: |
          U=https://api.ibb.gov.tr/ispark/Park
          for ua in "" "YerimVar/1 CFNetwork/1568.100.1 Darwin/24.0.0" "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"; do
            echo "== UA: '${ua:-curl default}'"
            curl -sS -m 40 -o body.txt -D head.txt -w "status=%{http_code} time=%{time_total}s size=%{size_download}\n" -H 'Accept: application/json' ${ua:+-A "$ua"} "$U" || echo "curl failed"
            head -12 head.txt; head -c 400 body.txt; echo; echo
          done
