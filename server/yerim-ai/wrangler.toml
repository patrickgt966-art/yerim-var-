name = "yerim-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# ANTHROPIC_API_KEY is set with `wrangler secret put ANTHROPIC_API_KEY`
# and is never committed to the repo.

[[kv_namespaces]]
binding = "QUOTA"
id = "b430e064b7f14fca89aed460e56dbf5e"

# Limits (strings). Change a value, then `npx wrangler deploy`: no app release is needed.
# Sınırlar (metin olarak yazılır). Değeri değiştirip `npx wrangler deploy` yapmak yeter;
# uygulama güncellemesi gerekmez. Boş bırakılırsa varsayılan değer kullanılır.
[vars]
# /chat (selam, teşekkür, veda): bir cihazın günde alabileceği sohbet cevabı sayısı. ✨ hakkından düşmez.
# Chat replies per device per day (does not use the daily ✨ uses). Default 15.
CHAT_DAILY_PER_DEVICE = "15"
# Tüm cihazlar için günlük toplam /chat cevabı; dolunca Anthropic'e hiç istek gitmez (429, reason "global").
# Chat replies per day across all devices; at the cap Anthropic is not called. Default 10000.
CHAT_GLOBAL_DAILY = "10000"
# IP başına günlük toplam AI çağrısı (/understand, /pick, /plan, /narrate ve /chat birlikte). Varsayılan 100.
# Calls per IP per day over all AI endpoints, /chat included. Default 100.
AI_DAILY_PER_IP = "100"
# Aynı cihazdan iki /chat çağrısı arasındaki en kısa süre, milisaniye (429, reason "slow"). Varsayılan 1000.
# Minimum time between two /chat calls of one device, in milliseconds. Default 1000.
CHAT_MIN_INTERVAL_MS = "1000"
