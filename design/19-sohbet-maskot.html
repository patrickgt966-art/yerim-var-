<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>19-sohbet-maskot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@500;700;800&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="canli.css">
<!--
  Sohbette Yerim (uygulamada src/components/chat/ChatMascot.tsx): yazı kutusunun üst kenarında oturur.
  Boşta göz kırpar · yazarken yazıya bakar · gönderince zıplar · cevap gelirken yukarı bakıp sallanır,
  düşünme noktaları · yer bulununca sevinir · hak azalınca sayıyı tutar · dokununca örnek soru yazar.
  render(t); ?capture.
-->
<style>
.bub{max-width:270px;padding:10px 13px;font-size:14px;line-height:20px}
.res{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #EFE6D8;border-radius:16px 16px 16px 5px;padding:9px 11px;margin-top:8px;width:290px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sec);display:inline-block}
.caret{display:inline-block;width:2px;height:18px;background:var(--navy);vertical-align:-3px;margin-left:1px}
</style>
<script src="maskot.js"></script>
</head><body>
<div class="screen paper" id="screen">
  <div class="rel" style="height:100%">
    <div data-status></div>
    <!-- başlık -->
    <div style="display:flex;align-items:center;gap:10px;padding:6px 16px 12px;border-bottom:1px dashed var(--peach-line)">
      <div style="width:36px;height:36px;border-radius:13px 13px 13px 4px;background:var(--orange);transform:rotate(-4deg);display:flex;align-items:center;justify-content:center" id="hdrFace"></div>
      <div style="flex:1"><div class="disp" style="font-weight:800;font-size:20px;line-height:22px">Yerim</div><div style="font-size:12px;font-weight:700;color:var(--mint-text)">● burada</div></div>
      <div id="quota" style="padding:6px 12px;border-radius:17px;background:#FFF3C4;font-weight:800;font-size:13px">Bugün 8 hak</div>
    </div>
    <div id="cap" class="abs" style="left:50%;top:9px;transform:translateX(-50%);z-index:60;white-space:nowrap;background:var(--navy);color:#fff;font-weight:800;font-size:12.5px;padding:7px 12px;border-radius:14px 14px 14px 5px"></div>

    <!-- mesajlar -->
    <div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:12px">
      <div id="u1" style="align-self:flex-end;background:var(--navy);color:#fff;border-radius:18px 18px 6px 18px" class="bub">Kordon'a yakın, park kolay balık</div>
      <div id="typing" style="display:flex;gap:5px;padding:14px 16px;background:#fff;border:1px solid #EFE6D8;border-radius:18px 18px 18px 6px;width:66px"><span class="dot" id="d1"></span><span class="dot" id="d2"></span><span class="dot" id="d3"></span></div>
      <div id="reply">
        <div class="bub" style="background:#fff;border:1px solid #EFE6D8;border-radius:18px 18px 18px 6px"><b>Kordon'da 3 balıkçı</b> buldum, otoparkı en yakın olan önde:</div>
        <div class="res"><span style="width:36px;height:36px;border-radius:50%;background:#D6ECF4;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 38 38"><path d="M5 20c6-8 18-9 26-2l4-4v12l-4-4c-8 7-20 6-26-2z" fill="#4F8FA6"/></svg></span><div style="flex:1"><div style="font-weight:800;font-size:14px">Kordon Balıkçısı</div><div class="sub" style="font-size:12px">otoparkı 200 m</div></div><span class="pill" style="background:var(--mint-soft);color:var(--mint-text)"><span class="live"></span>9 boş</span></div>
        <div class="res"><span style="width:36px;height:36px;border-radius:50%;background:#D6ECF4;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 38 38"><path d="M5 20c6-8 18-9 26-2l4-4v12l-4-4c-8 7-20 6-26-2z" fill="#4F8FA6"/></svg></span><div style="flex:1"><div style="font-weight:800;font-size:14px">Deniz Restoran</div><div class="sub" style="font-size:12px">otoparkı 260 m</div></div><span class="pill" style="background:var(--mint-soft);color:var(--mint-text)">14 boş</span></div>
      </div>
    </div>

    <!-- yazı kutusu ve Yerim -->
    <div class="abs" style="left:0;right:0;bottom:0;padding:10px 12px 30px;background:var(--paper);box-shadow:0 -2px 10px rgba(11,60,73,.06)">
      <div class="abs" style="right:14px;bottom:100%;display:flex;align-items:flex-end">
        <div id="think" style="display:flex;align-items:flex-end;gap:3px;margin:0 2px 44px 0"><span style="width:5px;height:5px;border-radius:50%;background:var(--sec)"></span><span style="width:7px;height:7px;border-radius:50%;background:var(--sec)"></span><span style="width:9px;height:9px;border-radius:50%;background:var(--sec)"></span></div>
        <div id="left" style="margin:0 2px 30px 0;padding:3px 8px;border-radius:10px 10px 10px 3px;background:#FFF3C4;font-weight:800;font-size:11px">2 hak</div>
        <div id="mascot" style="margin-bottom:-6px;transform-origin:50% 100%"></div>
      </div>
      <div class="field" style="padding:6px 6px 6px 14px">
        <div id="input" style="flex:1;font-size:15px;min-height:22px"></div>
        <div style="width:42px;height:42px;border-radius:14px 14px 14px 5px;background:var(--orange);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B3C49" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
      </div>
      <div id="finger" class="abs" style="width:46px;height:46px;border-radius:50%;background:rgba(11,60,73,.28);border:3px solid rgba(255,255,255,.95)"></div>
    </div>
  </div>
</div>
<script src="canli.js"></script>
<script>
const T = 13;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
$('hdrFace').innerHTML = '<svg width="24" height="20" viewBox="0 0 34 28"><ellipse cx="10" cy="10" rx="3.6" ry="4.8" fill="#0B3C49"/><ellipse cx="24" cy="10" rx="3.6" ry="4.8" fill="#0B3C49"/><path d="M12 18q5 5 10 0" fill="none" stroke="#0B3C49" stroke-width="2.8" stroke-linecap="round"/></svg>';
const Q1 = "Kordon'a yakın, park kolay balık", Q2 = 'Alsancak kahvaltı';
const B = { type: 1.4, send: 3.4, reply: 6.0, idle: 8.4, low: 9.0, tap: 10.4 };
const hopAt = (t, t0) => { const k = (t - t0) / 0.41; return k <= 0 || k >= 1 ? 0 : -14 * Math.sin(Math.PI * k); };
let last = '';
function render(tt) {
  const t = ((tt % T) + T) % T;
  // durum
  const typingUser = t >= B.type && t < B.send;
  const thinking = t >= B.send && t < B.reply;
  const cheer = t >= B.reply && t < B.reply + 2.4;
  const typed2 = t >= B.tap;
  $('cap').textContent = typingUser ? 'Yazarken: yazına bakar' : thinking ? 'Cevap gelirken: düşünür' : cheer ? 'Yer bulununca: sevinir' : t >= B.tap ? 'Dokununca: örnek soru yazar' : t >= B.low ? 'Hak azalınca: sayıyı tutar' : 'Boşta: göz kırpar';
  // yazı kutusu
  const n1 = Math.floor(clamp((t - B.type) / 1.8, 0, 1) * Q1.length);
  let input = typingUser ? Q1.slice(0, n1) : typed2 ? Q2 : '';
  $('input').innerHTML = input ? input + (typingUser ? '<span class="caret"></span>' : '') : '<span style="color:var(--sec)">Bir şey yaz…</span>';
  // mesajlar
  $('u1').style.opacity = t >= B.send ? 1 : 0;
  $('typing').style.display = thinking ? 'flex' : 'none';
  ['d1', 'd2', 'd3'].forEach((d, i) => ($(d).style.transform = `translateY(${thinking ? -3 * Math.max(0, Math.sin((t * 6) - i)) : 0}px)`));
  const rk = clamp((t - B.reply) / 0.3, 0, 1);
  $('reply').style.display = t >= B.reply ? 'block' : 'none';
  $('reply').style.opacity = rk; $('reply').style.transform = `translateY(${(1 - ease(rk)) * 10}px)`;
  $('quota').textContent = t >= B.low ? 'Bugün 2 hak' : t >= B.send ? 'Bugün 7 hak' : 'Bugün 8 hak';
  // Yerim
  let y = hopAt(t, B.send) + hopAt(t, B.reply) + hopAt(t, B.tap);
  if (thinking && t > B.send + 0.41) y += -2 - 2 * Math.sin((t - B.send) * 7.5);
  $('mascot').style.transform = `translateY(${y}px)`;
  $('think').style.display = thinking ? 'flex' : 'none';
  $('left').style.display = t >= B.low ? 'block' : 'none';
  const blink = !thinking && !cheer && (t % 3.2) > 3.06;
  const pose = thinking ? { eyes: 'up', mouth: 'o' } : cheer ? { eyes: 'happy', mouth: 'open', arm: 'up' } : (typingUser || typed2) ? { eyes: blink ? 'blink' : 'down', mouth: 'smile' } : { eyes: blink ? 'blink' : 'open', mouth: 'smile' };
  const key = JSON.stringify(pose);
  if (key !== last) { $('mascot').innerHTML = yerimMascot({ size: 58, ...pose }); last = key; }
  // parmak: Yerim'e dokunur
  const fk = clamp((t - (B.tap - 0.7)) / 0.5, 0, 1);
  const f = $('finger');
  f.style.opacity = t < B.tap - 0.7 || t > B.tap + 0.5 ? 0 : 1;
  f.style.right = 18 + (1 - ease(fk)) * 40 + 'px'; f.style.bottom = 96 - (1 - ease(fk)) * 60 + 'px';
  f.style.transform = `scale(${t > B.tap - 0.1 && t < B.tap + 0.1 ? 0.8 : 1})`;
}
window.seek = render; window.TOTAL = T;
if (!location.search.includes('capture')) { const st = performance.now(); const loop = (now) => { render((now - st) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
else render(0);
</script>
</body></html>
