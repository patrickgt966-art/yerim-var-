<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>17-acilis-sahne</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<link rel="stylesheet" href="canli.css">
<!--
  Her açılışta ~1 sn'lik giriş (uygulamada src/components/mascot/LaunchIntro.tsx, aynı zamanlama):
  açılış ekranının son karesi (beyaz, alt alta logo) -> 0.12 sn'de Yerim logonun üstüne yaylanarak çıkar,
  0.33'te ezilip oturur, 0.48'de gözleri güler, 0.76'dan 1.05'e kadar katman solarak uygulama açılır.
  Bu sahne önce 0.5 sn açılış ekranını, sonra girişi, sonra ana sayfayı gösterir. render(t); ?capture.
-->
<style>
.logo{display:flex;flex-direction:column;align-items:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:50px;line-height:1.26;letter-spacing:-.02em}
.logo .y{color:var(--navy);display:flex}
.logo .i{position:relative}
.logo .dot{position:absolute;top:.2205em;left:50%;width:.175em;height:.175em;margin-left:-.0875em;border-radius:50%;background:var(--orange)}
.logo .v{color:var(--orange);margin-top:-.34em}
</style>
</head><body>
<div class="screen" id="screen">
  <img src="4-anasayfa-canli.png" alt="" class="abs" style="left:0;top:0;width:390px">
  <div data-tabbar="index"></div>
  <div id="layer" class="abs" style="inset:0;background:#fff;z-index:50;display:flex;align-items:center;justify-content:center">
    <div class="rel" style="display:flex;flex-direction:column;align-items:center">
      <div id="tile" class="abs" style="bottom:100%;margin-bottom:6px;width:54px;height:54px;border-radius:20px 20px 20px 7px;background:var(--orange);display:flex;align-items:center;justify-content:center;transform-origin:50% 100%"></div>
      <div class="logo"><div class="y"><span>Yer</span><span class="i">ı<span class="dot"></span></span><span>m</span></div><div class="v">Var</div></div>
    </div>
  </div>
  <div id="cap" class="abs" style="left:50%;top:10px;transform:translateX(-50%);z-index:60;white-space:nowrap;background:var(--navy);color:#fff;font-weight:800;font-size:12.5px;padding:7px 12px;border-radius:14px 14px 14px 5px"></div>
</div>
<script src="canli.js"></script>
<script>
const SPLASH = 0.5, LAUNCH = 1.05, FADE_AT = 0.76, T = SPLASH + LAUNCH + 1.1;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
// yay: hedefe sönümlü salınımla oturur (damping 9, stiffness 220 ~ bu eğri)
const spring = (k) => (k <= 0 ? 0 : 1 - Math.exp(-7 * k) * Math.cos(k * 11));
const FACE = (happy) => `<svg width="32" height="26" viewBox="0 0 34 28">${happy
  ? '<path d="M5.5 11q4.5-6 9 0M19.5 11q4.5-6 9 0" fill="none" stroke="#0B3C49" stroke-width="2.8" stroke-linecap="round"/>'
  : '<ellipse cx="10" cy="10" rx="3.6" ry="4.8" fill="#0B3C49"/><ellipse cx="24" cy="10" rx="3.6" ry="4.8" fill="#0B3C49"/><circle cx="11.3" cy="8.2" r="1.3" fill="#fff"/><circle cx="25.3" cy="8.2" r="1.3" fill="#fff"/>'}<ellipse cx="4.5" cy="17" rx="3.2" ry="2" fill="rgba(255,110,80,.35)"/><ellipse cx="29.5" cy="17" rx="3.2" ry="2" fill="rgba(255,110,80,.35)"/><path d="M12 18q5 5 10 0" fill="none" stroke="#0B3C49" stroke-width="2.8" stroke-linecap="round"/></svg>`;
let last = '';
function render(tt) {
  const t = ((tt % T) + T) % T, l = t - SPLASH;
  $('cap').textContent = l < 0 ? 'Açılış ekranı' : l < LAUNCH ? 'Yerim Var girişi · ~1 sn' : 'Uygulama';
  const pop = spring(clamp((l - 0.12) / 0.6, 0, 1));
  const sq = l > 0.33 ? Math.exp(-6 * (l - 0.33)) * Math.cos((l - 0.33) * 22) * 0.2 : 0;
  $('tile').style.opacity = Math.min(1, pop * 3);
  $('tile').style.transform = `translateY(${(1 - pop) * 34}px) scale(${0.3 + 0.7 * pop}) scale(${1 + sq},${1 - sq}) rotate(-4deg)`;
  const happy = l > 0.48 ? 'h' : 'o';
  if (happy !== last) { $('tile').innerHTML = FACE(happy === 'h'); last = happy; }
  const f = clamp((l - FADE_AT) / (LAUNCH - FADE_AT), 0, 1);
  $('layer').style.opacity = 1 - f * f;
}
window.seek = render; window.TOTAL = T * 2; // iki kez, görmek kolay olsun
if (!location.search.includes('capture')) { const st = performance.now(); const loop = (now) => { render((now - st) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
else render(0);
</script>
</body></html>
