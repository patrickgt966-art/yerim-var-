<style>
body{margin:0}
button{font-family:inherit}
.disp{font-family:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,50px) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,-40px) scale(1.2)}}
@keyframes ring{0%{transform:scale(0.7);opacity:0.5}100%{transform:scale(2.1);opacity:0}}
@keyframes march{to{stroke-dashoffset:-36}}
@keyframes lane{to{stroke-dashoffset:-64}}
@keyframes carIn{from{transform:translateY(46px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.35}}
@keyframes driveUp{from{transform:translateY(900px)}to{transform:translateY(-80px)}}
@keyframes driveDown{from{transform:translateY(-80px)}to{transform:translateY(900px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{transform:rotate(-5deg) scale(0.3);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
@keyframes sunRise{from{transform:translateY(16px)}to{transform:translateY(-6px)}}
@keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(40px)}}
@keyframes ferryX{from{transform:translateX(-90px)}to{transform:translateX(430px)}}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.glow1{animation:drift1 9s ease-in-out infinite alternate}
.glow2{animation:drift2 11s ease-in-out infinite alternate}
.ring{animation:ring 5s ease-out infinite}
.march{animation:march 6s linear infinite}
.lane{animation:lane 5s linear infinite}
.car-in{animation:carIn 1.4s cubic-bezier(0.2,0.8,0.2,1) 0.3s both}
.blink{animation:blink 2.4s ease-in-out 1.7s infinite}
.drive-up{animation:driveUp 16s linear infinite}
.drive-down{animation:driveDown 20s linear infinite}
.rise1{animation:rise 0.8s ease-out 0.9s both}
.rise2{animation:rise 0.8s ease-out 1.1s both}
.rise3{animation:rise 0.8s ease-out 1.3s both}
.pop{animation:pop 0.7s cubic-bezier(0.3,1.6,0.5,1) 1.6s both}
.sun{animation:sunRise 8s ease-in-out infinite alternate}
.wave{animation:waveMove 4s linear infinite}
.ferry-x{animation:ferryX 24s linear infinite}
.gull{animation:floaty 3s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){
.glow1,.glow2,.ring,.march,.lane,.car-in,.blink,.drive-up,.drive-down,.rise1,.rise2,.rise3,.pop,.sun,.wave,.ferry-x,.gull{animation:none}
}
</style>
